# Secret scan in .github/workflows/secrets.yml, on top of the gitleaks default rules.
[extend]
useDefault = true

# Hashes in lockfiles trip the entropy rule generic-api-key. Only that rule is
# skipped there, real token formats like ghp_ or sk_live_ are still caught.
[[allowlists]]
description = "Lockfile hashes"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)bun\.lock$''',
  '''(^|/)pubspec\.lock$''',
]
